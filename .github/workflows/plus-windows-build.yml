name: Plus Windows build

# Pi Agent Plus versioning (see VERSIONING-PLUS.md):
# - push to `plus`  -> build <version>-dev.<run> and upload it as an artifact
# - push tag vX.Y.Z -> build X.Y.Z and publish a GitHub Release with the
#                      installer and the CHANGELOG-PLUS.md section as notes
# Updates: tag builds are signed with this fork's own updater key (secret
# TAURI_SIGNING_PRIVATE_KEY) and publish latest.json; the matching public key
# (src-tauri/tauri.conf.json) is compiled into every build, so the app can
# only install releases from this repository, never an upstream one.
# - manual run with flavor "test" -> "Pi Agent Plus Test": its own name,
#   identifier, port (38591) and prefs file, no updater, so it installs and
#   runs beside the main app (e.g. into D:\Pi Agent Plus Test) for checking
#   a build without touching the install in daily use.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "main = normal build; test = Pi Agent Plus Test (installs beside the main app)"
        type: choice
        options: [main, test]
        default: main
  push:
    branches: [plus]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: write

concurrency:
  group: plus-windows-build-${{ github.ref }}-${{ inputs.flavor || 'main' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Compute the build version
        id: version
        shell: bash
        run: |
          base="$(node -p "require('./plus-version.json').version")"
          if [ "${{ inputs.flavor }}" = "test" ]; then
            echo "value=${base}-test.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "test=true" >> "$GITHUB_OUTPUT"
            {
              echo "NEXT_PUBLIC_PLUS_FLAVOR=test"
              echo "PI_PLUS_SERVER_PORT=38591"
            } >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [ "$tag" != "$base" ]; then
              echo "::error::Tag v$tag does not match plus-version.json ($base)"
              exit 1
            fi
            echo "value=$base" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=${base}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Embed the updater public key
        if: steps.version.outputs.test != 'true'
        shell: bash
        run: echo "PI_AGENT_DESKTOP_UPDATER_PUBLIC_KEY=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")" >> "$GITHUB_ENV"

      - name: Run Plus unit tests
        run: node --experimental-strip-types --test lib/plus-features.test.mjs lib/session-title.test.mjs components/ChatAppearance.test.mjs

      - name: Prepare packaged Next.js server
        run: npm run desktop:prepare

      - name: Build installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.version.outputs.release == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.version.outputs.release == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if [ "${{ steps.version.outputs.release }}" = "true" ]; then
            updater=true
          else
            updater=false
          fi
          if [ "${{ steps.version.outputs.test }}" = "true" ]; then
            flavor=',"productName":"Pi Agent Plus Test","mainBinaryName":"pi-agent-plus-test","identifier":"com.fish9988.pi-agent-plus-test"'
          else
            flavor=''
          fi
          npx tauri build --target x86_64-pc-windows-msvc --bundles nsis \
            --config "{\"version\":\"${{ steps.version.outputs.value }}\",\"bundle\":{\"createUpdaterArtifacts\":$updater}$flavor}"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: pi-agent-plus${{ steps.version.outputs.test == 'true' && '-test' || '' }}-${{ steps.version.outputs.value }}-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.version.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.value }}"
          # Notes: the CHANGELOG-PLUS.md section for this version.
          awk -v v="$version" '
            $0 ~ "^## \\[?v?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG-PLUS.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Pi Agent Plus $version" > release-notes.md; fi
          installer="$(ls src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | head -n 1)"
          asset="Pi-Agent-Plus_${version}_x64-setup.exe"
          cp "$installer" "$asset"
          # Updater manifest: the in-app "Upgrade" button downloads the
          # installer named here and verifies it against the embedded key.
          if [ ! -f "$installer.sig" ]; then echo "::error::No updater signature next to $installer"; exit 1; fi
          VERSION="$version" SIG_FILE="$installer.sig" ASSET="$asset" REPO="$GITHUB_REPOSITORY" node -e '
            const fs = require("fs");
            const signature = fs.readFileSync(process.env.SIG_FILE, "utf8").trim();
            const notes = fs.readFileSync("release-notes.md", "utf8").trim();
            const url = `https://github.com/${process.env.REPO}/releases/download/v${process.env.VERSION}/${process.env.ASSET}`;
            const entry = { signature, url };
            fs.writeFileSync("latest.json", JSON.stringify({
              version: process.env.VERSION,
              notes,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": entry, "windows-x86_64-nsis": entry },
            }, null, 2));
          '
          gh release create "v$version" "$asset" latest.json \
            --title "Pi Agent Plus $version" --notes-file release-notes.md --target "$GITHUB_SHA" --latest \
            || gh release upload "v$version" "$asset" latest.json --clobber
